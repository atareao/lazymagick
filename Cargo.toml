[package]
name = "lazymagick"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A TUI for ImageMagick — compose and run magick recipes interactively"
license = "MIT"
readme = "README.md"
repository = "https://github.com/atareao/lazymagick"
homepage = "https://github.com/atareao/lazymagick"
keywords = ["imagemagick", "tui", "image-processing", "ratatui", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
glob = "0.3"
walkdir = "2"
color-eyre = "0.6"
tempfile = "3"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp"] }