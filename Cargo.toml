[package]
name = "lazymagick"
version = "0.1.0"
edition = "2024"
description = "A TUI for ImageMagick — compose and run magick recipes interactively"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
walkdir = "2"
color-eyre = "0.6"
tempfile = "3"