# NEW BASIC RECIPES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[[recipe]]
category = "Adjust"
name = "auto-orient"
description = "Auto-rotate and flip based on EXIF orientation, then strip orientation metadata"
tags = ["orient", "exif", "rotate"]
output_ext = "auto"
stages = [{ flags = ["-auto-orient", "-strip"] }]

[[recipe]]
category = "Resize"
name = "fit within"
description = "Shrink to fit within 1920×1080, only if larger (use \">\" geometry modifier)"
tags = ["resize", "scale", "fit"]
output_ext = "auto"
stages = [{ flags = ["-strip", "-resize", "1920x1080>"] }]

[[recipe]]
category = "Resize"
name = "crop center"
description = "Crop a 800×800 square from the center of the image"
tags = ["crop", "cut", "square"]
output_ext = "auto"
stages = [{ flags = ["-gravity", "center", "-crop", "800x800+0+0", "+repage"] }]

[[recipe]]
category = "Convert"
name = "convert"
description = "Pure format conversion without any transformations — just change the container"
tags = ["convert", "format"]
output_ext = "auto"
stages = [{ flags = [] }]

[recipe.formats]
jpeg = ["-quality", "92"]
png = []
webp = ["-quality", "85"]
avif = ["-quality", "60"]
jxl = ["-quality", "85"]

[[recipe]]
category = "Adjust"
name = "normalize"
description = "Auto-level colours: stretch contrast to full range, remove colour cast"
tags = ["color", "contrast", "auto"]
output_ext = "auto"
stages = [{ flags = ["-normalize"] }]

[[recipe]]
category = "Optimize"
name = "compress"
description = "Aggressive web-optimised compression: strip metadata + quality 80 with chroma subsampling"
tags = ["compress", "optimize", "web"]
output_ext = "auto"
stages = [{ flags = ["-strip"] }]

[recipe.formats]
jpeg = ["-quality", "80", "-sampling-factor", "4:2:0"]
webp = ["-quality", "80"]
avif = ["-quality", "50", "-effort", "6"]
png = ["-quality", "80"]
jxl = ["-quality", "75"]

[[recipe]]
category = "Optimize"
name = "reduce palette"
description = "Reduce to 256 colours with 8-bit depth — creates indexed PNG"
tags = ["palette", "colors", "indexed", "gif"]
output_ext = "png"
stages = [{ flags = ["-colors", "256", "-depth", "8"] }]

[recipe.formats]
png = ["-colors", "256", "-depth", "8"]
gif = ["-colors", "256"]

