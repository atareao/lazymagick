name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          min-toolchain-version: "1.85"

      - name: Install ImageMagick 7 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # On Ubuntu, `magick` may not be in PATH; create a wrapper
          if ! command -v magick &>/dev/null; then
            echo '#!/bin/bash
exec convert "$@"' | sudo tee /usr/local/bin/magick
            sudo chmod +x /usr/local/bin/magick
          fi
          magick -version

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test