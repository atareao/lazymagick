name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          min-toolchain-version: "1.85"

      - name: Install ImageMagick 7 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev libpng-dev libwebp-dev libheif-dev \
            libraw-dev libtiff-dev libfreetype6-dev libfontconfig1-dev
          curl -L -o /tmp/im7.tar.gz \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-35/ImageMagick-7.1.2-35.tar.gz
          cd /tmp && tar xzf im7.tar.gz && cd ImageMagick-7.1.2-35
          ./configure --prefix=/usr --enable-shared=yes --with-modules
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          magick -version

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

      - name: Publish to crates.io
        if: runner.os == 'Linux'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish